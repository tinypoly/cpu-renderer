# Publishes @tinypoly/cpu-renderer to npm when a GitHub release is published.
# The release tag must match the package version (v0.1.0 for "version": "0.1.0").
# Requires the NPM_TOKEN secret (an npm automation token with publish access to @tinypoly).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1; }
      # prepublishOnly builds first (the example type-checks against dist), then runs lint, typecheck and tests.
      - run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
